name: Montar instalador

on:
  push:
    branches: [main, teste]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSAO: 1.0.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Gravar a versão
        shell: pwsh
        run: Set-Content -Path versao.txt -Value $env:VERSAO -NoNewline

      - name: Montar o programa (.exe)
        run: >
          pyinstaller --noconfirm --windowed --name "Forja de Pergaminhos"
          --icon icone.ico --add-data "icone.ico;." --add-data "icone.png;."
          --add-data "assets;assets" --add-data "versao.txt;."
          --hidden-import PIL._tkinter_finder --collect-all tkinterdnd2 --collect-all pdf2docx meupdf.py

      - name: Testar se o programa abre
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Forja de Pergaminhos\Forja de Pergaminhos.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Get-Content "dist\Forja de Pergaminhos\_internal\erro.txt" -ErrorAction SilentlyContinue; exit 1 }
          Stop-Process -Id $p.Id -Force

      - name: Teste automático (todas as ferramentas e telas)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install ghostscript -y --no-progress | Out-Null
          $env:PATH += ";" + ((Get-ChildItem "C:\Program Files\gs\*\bin" -Directory | Select-Object -First 1).FullName)
          $p = Start-Process -FilePath "dist\Forja de Pergaminhos\Forja de Pergaminhos.exe" -ArgumentList "--autoteste","$PWD\testes_ci" -PassThru
          $p | Wait-Process -Timeout 1500 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; Write-Host "AUTOTESTE NAO TERMINOU" }
          Get-Content testes_ci\resultados.txt -ErrorAction SilentlyContinue
          Get-Content "dist\Forja de Pergaminhos\_internal\erro.txt" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testes-windows
          path: testes_ci/
          retention-days: 14

      - name: Guardar fotos do teste no repositório
        if: github.ref == 'refs/heads/teste'
        shell: pwsh
        run: |
          git config user.name "robo-da-forja"
          git config user.email "robo-da-forja@users.noreply.github.com"
          git checkout --orphan resultados
          git rm -rf --cached . | Out-Null
          git add -f testes_ci/*.png testes_ci/resultados.txt
          git commit -m "Resultados do teste automático"
          git push -f origin resultados

      - name: Comparar com a versão anterior
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          gh release download --pattern manifesto.json --dir anterior 2>$null
          if (-not (Test-Path anterior\manifesto.json)) { Write-Host "Primeira versão com manifesto" }
          python ferramentas/gerar_atualizacao.py "dist/Forja de Pergaminhos" saida/manifesto.json anterior/manifesto.json

      - name: Criar os instaladores
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSAO" instalador.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path atualizacao_arquivos.iss) {
            & $iscc "/DAppVersion=$env:VERSAO" atualizacao.iss
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-ChildItem saida

      - name: Publicar para download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          name: Forja de Pergaminhos ${{ env.VERSAO }}
          body: |
            **Instalar-Forja-de-Pergaminhos.exe** — versão completa, para instalar do zero.
            **Atualizar-Forja-de-Pergaminhos.exe** — só o que mudou, para quem já tem a Forja instalada (quando disponível).
          files: |
            saida/Instalar-Forja-de-Pergaminhos.exe
            saida/Atualizar-Forja-de-Pergaminhos.exe
            saida/manifesto.json
          fail_on_unmatched_files: false
