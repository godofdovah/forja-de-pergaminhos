name: Montar instalador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Montar o programa (.exe)
        run: >
          pyinstaller --noconfirm --windowed --name "Forja de Pergaminhos"
          --icon icone.ico --add-data "icone.ico;." --add-data "icone.png;."
          --collect-all tkinterdnd2 --collect-all pdf2docx meupdf.py

      - name: Testar se o programa abre
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Forja de Pergaminhos\Forja de Pergaminhos.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Get-Content "dist\Forja de Pergaminhos\_internal\erro.txt" -ErrorAction SilentlyContinue; exit 1 }
          Stop-Process -Id $p.Id -Force

      - name: Criar o instalador
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" instalador.iss

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Forja de Pergaminhos 1.0.${{ github.run_number }}
          body: Baixe o arquivo Instalar-Forja-de-Pergaminhos.exe e dê dois cliques.
          files: saida/Instalar-Forja-de-Pergaminhos.exe
